<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Misericordia</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="icon" type="image/png" href="./assets/choir-logo-2024.png" />
        <meta name="theme-color" content="#1f2937" />
        <style>
            .filter-scroll-row {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                gap: 8px;
                overflow-x: auto;
                overflow-y: hidden;
                max-width: 100%;
                min-width: 0;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                cursor: grab;
                user-select: none;
            }

            .filter-scroll-row::-webkit-scrollbar {
                display: none;
            }

            .filter-scroll-row.is-dragging {
                cursor: grabbing;
            }

            .filter-scroll-row > button {
                flex: 0 0 auto;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="title-row">
                <div class="brand-group">
                    <img src="assets/choir-logo-2024.png" alt="Misericordia Choir Logo" class="app-logo" />
                    <h1>Misericordia</h1>
                </div>

                <button id="menu-btn" class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="side-drawer">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="search-wrapper">
                <input id="search-input" type="search" placeholder="Search song title..." autocomplete="off" />
                <button id="clear-search-btn" class="clear-search-btn" type="button" aria-label="Clear search" hidden>&times;</button>
            </div>

            <div id="main-filters" class="filter-scroll-row" role="group" aria-label="Main filters"></div>
            <div id="sub-filters" class="filter-scroll-row" role="group" aria-label="Sub filters"></div>
        </header>

        <main>
            <ul id="song-list"></ul>
        </main>

        <!-- Backdrop & Right Side Panel -->
        <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

        <aside id="side-drawer" class="side-drawer" aria-label="Menu and settings" aria-hidden="true">
            <div class="drawer-header">
                <h2>Menu</h2>
                <button id="close-drawer-btn" class="close-drawer-btn" type="button" aria-label="Close menu">&times;</button>
            </div>

            <div class="drawer-body">
                <section class="drawer-section">
                    <h3>Display</h3>
                    <label class="drawer-option">
                        <span>Dark Mode</span>
                        <input id="dark-mode-toggle" type="checkbox" />
                    </label>
                    <label class="drawer-option">
                        <span>Lyrics Font Size</span>
                        <select id="font-size-select">
                            <option value="normal">Normal</option>
                            <option value="large">Large</option>
                            <option value="xlarge">Extra Large</option>
                        </select>
                    </label>
                </section>

                <section class="drawer-section">
                    <h3>Library &amp; App</h3>
                    <button id="refresh-cache-btn" class="drawer-action-btn danger-action-btn" type="button">Force Refresh Cache</button>
                    <p class="drawer-meta">Offline Choir Library • v0.3a</p>
                </section>
            </div>
        </aside>

        <script src="songs.js"></script>
        <script src="app.js"></script>
        <script>
            (() => {
                const rows = document.querySelectorAll(".filter-scroll-row");
                rows.forEach((row) => {
                    let isDown = false;
                    let startX = 0;
                    let startScrollLeft = 0;
                    let hasDragged = false;

                    row.addEventListener("mousedown", (e) => {
                        if (e.button !== 0) return;
                        isDown = true;
                        hasDragged = false;
                        startX = e.pageX - row.offsetLeft;
                        startScrollLeft = row.scrollLeft;
                        row.classList.add("is-dragging");
                    });

                    window.addEventListener("mousemove", (e) => {
                        if (!isDown) return;
                        const x = e.pageX - row.offsetLeft;
                        const delta = x - startX;
                        if (Math.abs(delta) > 5) {
                            hasDragged = true;
                        }
                        if (hasDragged) {
                            e.preventDefault();
                            row.scrollLeft = startScrollLeft - delta * 1.2;
                        }
                    });

                    window.addEventListener("mouseup", () => {
                        if (!isDown) return;
                        isDown = false;
                        row.classList.remove("is-dragging");
                        setTimeout(() => {
                            hasDragged = false;
                        }, 0);
                    });

                    row.addEventListener(
                        "click",
                        (e) => {
                            if (hasDragged) {
                                e.preventDefault();
                                e.stopPropagation();
                            }
                        },
                        true
                    );
                });

                // Reset sub-filter scroll position whenever its buttons change
                const subFilters = document.getElementById("sub-filters");
                if (subFilters) {
                    const observer = new MutationObserver(() => {
                        subFilters.scrollLeft = 0;
                    });
                    observer.observe(subFilters, { childList: true });
                }
            })();

            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("./sw.js");
                });
            }
        </script>
    </body>
</html>
