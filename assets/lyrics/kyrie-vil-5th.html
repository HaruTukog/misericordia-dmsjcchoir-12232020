<p class="composer" style="font-size: 0.85rem;">
    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
        Kami nakasala Kanimo ug nakalapas sa Imong kaayo. <br>
        Ginoo, Ginoo, kaloy-i kami.
    </p>

    <p>
        Pakita'ag gugma ug kalooy kami nga nagapaabut sa kaluwasan. <br>
        Cristo, Cristo, kaloy-i kami.
    </p>

    <p>
        Kasing-kasing nga mahinulsulon, ayaw Ginoo isalikway, <br>
        Ginoo, Ginoo, kaloy-i kami.
    </p>
</div>
