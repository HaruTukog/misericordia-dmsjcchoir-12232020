<div class="stanza">
    <p>
        Kami nakasala Kanimo ug nakalapas sa Imong kaayo. <br>
        Ginoo, kaloy-i kami, kaloy-i, kaloy-i kami.
    </p>

    <p>
        Pakita'ag gugma ug kalooy, kami nga nagapaabot sa kaluwasan. <br>
        Ginoo, kaloy-i kami, kaloy-i, kaloy-i kami.
    </p>
</div>
